name: Bug
description: Report a reproducible Unclaimed problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove API keys, private domains, database contents, and raw registrar responses.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest command and safe sample input that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "unclaimed 0.1.0"
    validations:
      required: true
